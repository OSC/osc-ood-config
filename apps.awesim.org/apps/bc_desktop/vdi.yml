---
title: "Lightweight Desktop"
description: |
  This app will launch an interactive desktop with one core which could be shared. It
  is a small environment for lightweight tasks (similar to a login node) such as accessing
  & viewing files, submitting jobs, compiling code, and running visualization software.
  You should be provisioned a desktop nearly immediately.

  If you need dedicated resources for compute or memory intensive workloads use a
  Desktop app like [Pitzer], [Ascend] or [Cardinal] where you will have full access to them.

  [Pitzer]: /pun/sys/dashboard/batch_connect/sys/bc_desktop/pitzer/session_contexts/new
  [Ascend]: /pun/sys/dashboard/batch_connect/sys/bc_desktop/ascend/session_contexts/new
  [Cardinal]: /pun/sys/dashboard/batch_connect/sys/bc_desktop/cardinal/session_contexts/new
form:
  - cluster
  - bc_vnc_idle
  - desktop
  - auto_accounts
  - bc_num_hours
  - global_licenses
  - bc_vnc_resolution
  - bc_email_on_started
attributes:
  cluster:
    widget: select
    options:
      - ["Pitzer", "pitzer"]
      - ["Ascend", "ascend"]
      - ["Cardinal", "cardinal"]
  desktop:
    widget: select
    label: "Desktop environment"
    options:
      - ["Xfce", "xfce"]
      - ["Mate", "mate"]
      - [ 
          "Gnome", "gnome", 
          data-option-for-cluster-ascend: false,
          data-option-for-cluster-cardinal: false,
        ]
    help: |
      This will launch either the [Xfce] or [Mate] desktop environment on the
      [Pitzer], [Ascend] or [Cardinal] clusters.

      [Xfce]: https://xfce.org/
      [Mate]: https://mate-desktop.org/
      [Pitzer]: https://www.osc.edu/resources/technical_support/supercomputers/pitzer
      [Ascend]: https://www.osc.edu/resources/technical_support/supercomputers/ascend
      [Cardinal]: https://www.osc.edu/resources/technical_support/supercomputers/cardinal
  bc_email_on_started: 0
  bc_vnc_idle: 0
  bc_vnc_resolution:
    required: true
submit: submit/vdi.yml.erb
