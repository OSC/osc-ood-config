global_bc_form_items:
  global_job_type:
    label: "Job type"
    widget: select
    options:
    - - "CPU"
      - cpu-batch
      - data-set-global-default-values: "cpu-batch"
      - data-hide-auto-modules-cuda: true
      - data-set-auto-modules-cuda: ''
      - data-hide-global-enable-vis: true
      - data-set-global-enable-vis: 0
      - data-hide-global-gpu-type: true
      - data-hide-global-gpus: true
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes-for-cluster-cardinal: 12
      - data-max-bc-num-nodes-for-cluster-ascend: 16
      - data-max-bc-num-nodes-for-cluster-pitzer: 36
      - data-min-global-num-cores: 1
      - data-max-global-num-cores-for-cluster-cardinal: 96
      - data-max-global-num-cores-for-cluster-ascend: 118
      - data-max-global-num-cores-for-cluster-pitzer: 48
      - data-min-global-gpus: 0
      - data-max-global-gpus: 0
      - data-min-global-mem: 4
      - data-max-global-mem-for-cluster-cardinal: 1860   # hugemem
      - data-max-global-mem-for-cluster-ascend: 464      # batch/nextgen, no GPU
      - data-max-global-mem-for-cluster-pitzer: 2988     # hugemem
      - data-help-global-mem: ''
    - - "GPU"
      - gpu-batch
      - data-set-global-default-values: "gpu-batch"
      - data-hide-auto-modules-cuda: false
      - data-hide-global-enable-vis: false
      - data-hide-global-gpu-type: false
      - data-hide-global-gpus: false
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes-for-cluster-cardinal: 12
      - data-max-bc-num-nodes-for-cluster-ascend: 16
      - data-max-bc-num-nodes-for-cluster-pitzer: 6
      - data-min-global-num-cores: 1
      - data-max-global-num-cores-for-cluster-cardinal: 96
      - data-max-global-num-cores-for-cluster-ascend: 120
      - data-max-global-num-cores-for-cluster-pitzer: 48
      - data-min-global-gpus: 1
      - data-max-global-gpus-for-cluster-cardinal: 4
      - data-max-global-gpus-for-cluster-ascend: 4
      - data-max-global-gpus-for-cluster-pitzer: 2
      - data-min-global-mem: 4
      - data-max-global-mem-for-cluster-cardinal: 864   # gpu
      - data-max-global-mem-for-cluster-ascend: 921     # quad/batch, 4 GPUs
      - data-max-global-mem-for-cluster-pitzer: 363     # gpu, gpu-exp
      - data-help-global-mem-for-cluster-ascend: |
          The maximum memory allowance varies based on the number of GPUs. For details, refer to the [Batch Limit Rules]

          [Batch Limit Rules] https://www.osc.edu/resources/technical_support/supercomputers/ascend/batch_limit_rules
  global_gpu_type:
    label: "GPU types"
    widget: select
    options:
    - - "H100 94GB"
      - cardinal-gpu
      - data-option-for-cluster-cardinal: true
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: false
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 12
      - data-min-global-num-cores: 1
      - data-max-global-num-cores: 96
      - data-max-global-gpus: 4
      - data-min-global-mem: 4
      - data-max-global-mem: 864
    - - "Any GPU"
      - ascend-batch
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: true
      - data-option-for-cluster-pitzer: false
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 16
      - data-min-global-num-cores: 1
      - data-max-global-num-cores: 120
      - data-max-global-gpus: 4
      - data-min-global-mem: 4
      - data-max-global-mem: 921
    - - "A100 40GB"
      - ascend-nextgen
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: true
      - data-option-for-cluster-pitzer: false
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 16
      - data-min-global-num-cores: 1
      - data-max-global-num-cores: 120
      - data-max-global-gpus: 3
      - data-min-global-mem: 4
      - data-max-global-mem: 471
    - - "A100 80GB"
      - ascend-quad
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: true
      - data-option-for-cluster-pitzer: false
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 4
      - data-min-global-num-cores: 1
      - data-max-global-num-cores: 88
      - data-max-global-gpus: 4
      - data-min-global-mem: 4
      - data-max-global-mem: 921
    - - "Any GPU"
      - pitzer-batch
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 6
      - data-min-global-num-cores: 1
      - data-max-global-num-cores: 48
      - data-max-global-gpus: 2
      - data-min-global-mem: 4
      - data-max-global-mem: 363
    - - "V100 16GB"
      - pitzer-gpu
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 4
      - data-min-global-num-cores: 1
      - data-max-global-num-cores: 40
      - data-max-global-gpus: 2
      - data-min-global-mem: 4
      - data-max-global-mem: 363
    - - "V100 32GB"
      - pitzer-gpu-exp
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 6
      - data-min-global-num-cores: 1
      - data-max-global-num-cores: 48
      - data-max-global-gpus: 2
      - data-min-global-mem: 4
      - data-max-global-mem: 363
    - - "V100s 32GB (NVLink)"
      - pitzer-gpu-quad
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 1
      - data-min-global-num-cores: 1
      - data-max-global-num-cores: 48
      - data-min-global-gpus: 3
      - data-max-global-gpus: 4
      - data-min-global-mem: 4
      - data-max-global-mem: 744
  global_num_cores:
    label: "Number of cores per node"
    widget: number_field
    display: true
    value: 1
  global_gpus:
    label: "GPUs per node"
    widget: number_field
    display: true
    value: 1
  global_enable_vis:
    label: "Enable visualization"
    widget: check_box
    value: 0
  global_enable_mem:
    label: "Set memory"
    widget: check_box
    value: 0
    html_options:
      data:
        hide-global-mem-when-checked: false
  global_mem:
    label: "Memory in GB"
    widget: number_field
    hide_by_default: true
    value: 4
  global_enable_debug:
    label: "Use debug queue"
    widget: check_box
    value: 0
  global_licenses:
    label: "Licenses"
    help: |
      Licenses are comma separeated in the format '\<name\>@osc:\<# of licenses\>' like
      'stata@osc:1'.
    values: ''
    pattern: '^([\w]+@osc:\d+,{0,1})+$'
  global_default_values:
    label: "Default values"
    hide_by_default: true
    widget: select
    options:
    - - "CPU"
      - cpu-batch
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes-for-cluster-cardinal: 12
      - data-max-bc-num-nodes-for-cluster-ascend: 16
      - data-max-bc-num-nodes-for-cluster-pitzer: 36
      - data-min-global-num-cores: 1
      - data-max-global-num-cores-for-cluster-cardinal: 96
      - data-max-global-num-cores-for-cluster-ascend: 118
      - data-max-global-num-cores-for-cluster-pitzer: 48
      - data-min-global-gpus: 0
      - data-max-global-gpus: 0
      - data-min-global-mem: 4
      - data-max-global-mem-for-cluster-cardinal: 1860   # hugemem
      - data-max-global-mem-for-cluster-ascend: 464      # batch/nextgen, no GPU
      - data-max-global-mem-for-cluster-pitzer: 2988     # hugemem
    - - "GPU"
      - gpu-batch
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes-for-cluster-cardinal: 12
      - data-max-bc-num-nodes-for-cluster-ascend: 16
      - data-max-bc-num-nodes-for-cluster-pitzer: 6
      - data-min-global-num-cores: 1
      - data-max-global-num-cores-for-cluster-cardinal: 96
      - data-max-global-num-cores-for-cluster-ascend: 120
      - data-max-global-num-cores-for-cluster-pitzer: 48
      - data-min-global-gpus: 1
      - data-max-global-gpus-for-cluster-cardinal: 4
      - data-max-global-gpus-for-cluster-ascend: 4
      - data-max-global-gpus-for-cluster-pitzer: 2
      - data-min-global-mem: 4
      - data-max-global-mem-for-cluster-cardinal: 864   # gpu
      - data-max-global-mem-for-cluster-ascend: 921     # quad/batch, 4 GPUs
      - data-max-global-mem-for-cluster-pitzer: 363     # gpu, gpu-exp
